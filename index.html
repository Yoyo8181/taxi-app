<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タクシー営業ノート</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#18212f;background:#f3f5f8}
*{box-sizing:border-box}
body{margin:0}
header{background:#16243a;color:white;padding:14px}
h1{font-size:21px;margin:0 0 10px}
main{max-width:850px;margin:auto;padding:12px}
.panel{background:white;border-radius:13px;padding:13px;margin-bottom:12px;box-shadow:0 2px 7px #0000000b}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{border:0;border-radius:9px;padding:12px 10px;font-size:15px;font-weight:650;background:#e6ebf2;color:#17243a;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.primary{background:#1769d2;color:white}
.danger{background:#b82e3b;color:white}
.success{background:#16845b;color:white}
.dispatch{flex:1;min-width:65px;background:#1769d2;color:white}
input,select,textarea{width:100%;padding:10px;border:1px solid #ccd3de;border-radius:8px;font-size:16px;margin:4px 0 10px}
label{font-size:13px;font-weight:650}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{background:#253751;padding:9px;border-radius:9px}
.metric small{display:block;color:#d2dbea;font-size:12px}
.metric strong{font-size:19px}
#map{height:280px;border-radius:10px}
.muted{font-size:13px;color:#657184}
.item{border-top:1px solid #e3e7ed;padding:10px 0}
.item:first-child{border-top:0}
.item button{padding:8px;font-size:13px}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:6px 0}
.status{font-weight:700;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:480px){#map{height:240px}.metric strong{font-size:16px}button{padding:11px 8px}}
</style>
</head>
<body>
<header>
  <h1>🚕 タクシー営業ノート</h1>
  <div class="status" id="shiftStatus">勤務外</div>
  <div class="metrics">
    <div class="metric"><small>本日売上</small><strong id="sales">¥0</strong></div>
    <div class="metric"><small>乗車回数</small><strong id="rides">0</strong></div>
    <div class="metric"><small>勤務時間</small><strong id="hours">0分</strong></div>
  </div>
</header>

<main>
  <section class="panel">
    <div class="row">
      <button class="primary" id="shiftBtn" onclick="toggleShift()">勤務開始</button>
      <button onclick="getLocation(true)">現在地を取得</button>
    </div>
    <p class="muted" id="gpsStatus">GPS未取得</p>
  </section>

  <section class="panel">
    <h2>配車・乗車開始</h2>
    <div class="row">
      <button class="dispatch" onclick="startJob('流し')">流し</button>
      <button class="dispatch" onclick="startJob('Uber')">Uber</button>
      <button class="dispatch" onclick="startJob('GO')">GO</button>
      <button class="dispatch" onclick="startJob(getOtherSource())" id="otherDispatch">その他</button>
    </div>
    <p class="muted">アプリ配車は鳴った時点、流しはお客様が乗車した時点で押す。</p>
    <div id="activeJob" class="item">進行中の乗務はありません。</div>
    <div class="row" id="jobActions" style="margin-top:8px"></div>
  </section>

  <section class="panel">
    <h2>走行マップ</h2>
    <div id="map"></div>
    <p class="muted">勤務中のGPS記録は画面を開いている間に取得します。位置情報の許可が必要です。</p>
  </section>

  <section class="panel">
    <h2>予約</h2>
    <form id="bookingForm">
      <label>予約時刻</label><input id="bookingTime" type="datetime-local" required>
      <label>迎車地・予約内容</label><input id="bookingPlace" placeholder="例：名駅西口">
      <label>メモ</label><input id="bookingNote" placeholder="お客様名・行先など">
      <button class="primary" type="submit">予約を追加</button>
    </form>
    <label>予約内容を貼り付け</label>
    <textarea id="bookingPaste" rows="2" placeholder="配車アプリなどの予約内容を貼り付け"></textarea>
    <button onclick="pasteBooking()">貼り付け内容から予約を作成</button>
    <div id="bookingList"></div>
  </section>

  <section class="panel">
    <h2>休憩・帰庫</h2>
    <div class="row">
      <button id="restBtn" onclick="toggleRest()">休憩開始</button>
      <button class="danger" onclick="returnBase()">帰庫・勤務終了</button>
    </div>
    <p id="restStatus" class="muted">休憩中ではありません</p>
  </section>

  <section class="panel">
    <h2>売上・履歴・バックアップ</h2>
    <div class="row">
      <button onclick="renderHistory()">履歴を更新</button>
      <button onclick="exportData()">JSONバックアップ</button>
      <button onclick="document.getElementById('importFile').click()">バックアップを復元</button>
      <input id="importFile" type="file" accept=".json,application/json" hidden onchange="importData(event)">
    </div>
    <div id="history"></div>
  </section>

  <section class="panel">
    <h2>設定</h2>
    <label>「その他」配車ボタンの表示名</label>
    <select id="otherSource">
      <option>DiDi</option><option>S.RIDE</option><option>会社無線</option><option>その他</option>
    </select>
    <button onclick="saveSettings()">設定を保存</button>
    <p class="muted">配車アプリ名は記録に保存されます。</p>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const KEY = "yoyoTaxiV2";
const $ = id => document.getElementById(id);
const now = () => new Date().toISOString();
const yen = n => "¥" + Number(n || 0).toLocaleString("ja-JP");
const today = () => new Date().toLocaleDateString("sv-SE");
let data = loadData();
let position = null, watchId = null, routeLine = null, markers = [];
let map;

function loadData(){
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if(d) return d;
  } catch(e){}
  return {shift:null, rides:[], events:[], bookings:[], settings:{other:"DiDi"}, rest:null};
}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render();}
function event(type, extra={}){
  const e={id:crypto.randomUUID(),type,time:now(),lat:position?.lat??null,lon:position?.lon??null,...extra};
  data.events.push(e);return e;
}
function getOtherSource(){return data.settings.other || "その他";}
function saveSettings(){
  data.settings.other=$("otherSource").value;
  $("otherDispatch").textContent=data.settings.other;
  save();
}
function toggleShift(){
  if(!data.shift){
    data.shift={start:now(),end:null};
    event("勤務開始");
    startGPS();
  }else{
    returnBase();
  }
}
function startGPS(){
  if(!navigator.geolocation){$("gpsStatus").textContent="このブラウザはGPSに対応していません";return;}
  if(watchId!==null)return;
  watchId=navigator.geolocation.watchPosition(p=>{
    position={lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy};
    $("gpsStatus").textContent=`GPS取得済み（誤差 約${Math.round(position.accuracy)}m）`;
    if(map && !window.centered){map.setView([position.lat,position.lon],15);window.centered=true;}
    if(data.shift && data.active){
      const j=data.active;
      j.route=j.route||[];
      const last=j.route[j.route.length-1];
      if(!last || Date.now()-new Date(last.time).getTime()>=5000){
        j.route.push({time:now(),lat:position.lat,lon:position.lon});
        if(j.route.length>10000)j.route.shift();
        drawRoute();
        saveSilent();
      }
    }
  },e=>{$("gpsStatus").textContent="GPSエラー："+e.message;},
  {enableHighAccuracy:true,maximumAge:1000,timeout:10000});
}
function stopGPS(){
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;}
}
function getLocation(center=false){
  if(!navigator.geolocation){alert("GPSが使えません");return;}
  navigator.geolocation.getCurrentPosition(p=>{
    position={lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy};
    $("gpsStatus").textContent=`GPS取得済み（誤差 約${Math.round(position.accuracy)}m）`;
    if(center && map)map.setView([position.lat,position.lon],16);
  },e=>alert("位置情報を取得できません："+e.message),
  {enableHighAccuracy:true,timeout:10000});
}
function saveSilent(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}}

function startJob(source){
  if(!data.shift){if(!confirm("勤務開始していません。勤務を開始しますか？"))return;data.shift={start:now(),end:null};startGPS();}
  if(data.active){alert("現在の乗務が進行中です。追加配車機能を使ってください。");return;}
  getLocation(false);
  const j={id:crypto.randomUUID(),source,stage:source==="流し"?"乗車中":"迎車中",
    dispatchTime:now(),dispatchLat:position?.lat??null,dispatchLon:position?.lon??null,
    dispatchWeather:null,route:[],fare:null,cancelType:null};
  data.active=j;data.rides.push(j);
  event("配車受付",{rideId:j.id,source});
  if(source==="流し"){
    j.boardTime=now();j.boardLat=position?.lat??null;j.boardLon=position?.lon??null;
    event("流し乗車",{rideId:j.id});
  }
  save();
}
function arrival(){
  const j=data.active;if(!j||j.source==="流し"||j.stage!=="迎車中")return;
  j.stage="現着";j.arrivalTime=now();j.arrivalLat=position?.lat??null;j.arrivalLon=position?.lon??null;
  event("現着",{rideId:j.id,source:j.source});
  save();
  alert("現着を記録しました。5分経過後、乗務員キャンセルを選べます。");
}
function boarding(){
  const j=data.active;if(!j||j.stage!=="現着")return;
  j.stage="乗車中";j.boardTime=now();j.boardLat=position?.lat??null;j.boardLon=position?.lon??null;
  event("出発・乗車",{rideId:j.id,source:j.source});
  save();
}
function fare(){
  const j=data.active;if(!j||j.stage!=="乗車中")return;
  const v=prompt("運賃を円で入力してください",j.fare==null?"":String(j.fare));
  if(v===null)return;
  const n=Number(v);
  if(!Number.isFinite(n)||n<0){alert("0以上の金額を入力してください");return;}
  j.fare=n;j.fareSavedAt=now();event("金額入力",{rideId:j.id,fare:n});
  save();
}
function dropoff(){
  const j=data.active;if(!j||j.stage!=="乗車中")return;
  if(j.fare==null){alert("先に金額入力をしてください");return;}
  j.stage="完了";j.dropTime=now();j.dropLat=position?.lat??null;j.dropLon=position?.lon??null;
  event("降車・営業終了",{rideId:j.id,fare:j.fare});
  data.active=null;save();
}
function cancelRide(type){
  const j=data.active;if(!j)return;
  if(type==="乗務員"){
    if(!j.arrivalTime){alert("現着を記録してからキャンセルしてください");return;}
    const elapsed=Date.now()-new Date(j.arrivalTime).getTime();
    if(elapsed<5*60*1000){alert("現着から5分経過していません");return;}
  }
  if(!confirm(type+"キャンセルとして記録しますか？"))return;
  j.stage="キャンセル";j.cancelType=type;j.cancelTime=now();
  event("キャンセル",{rideId:j.id,source:j.source,cancelType:type});
  data.active=null;save();
}
function addJob(){
  const j=data.active;if(!j)return;
  const source=j.source;
  const v=prompt("追加配車の内容を入力してください（配車元："+source+"）");
  if(v===null)return;
  event("追加配車",{rideId:j.id,source,detail:v});
  alert("追加配車を記録しました。追加案件の詳細な複数同時管理は今後の改修項目です。");
  save();
}
function toggleRest(){
  if(!data.shift){alert("先に勤務を開始してください");return;}
  if(!data.rest){data.rest={start:now()};event("休憩開始");}
  else {event("休憩終了",{start:data.rest.start});data.rest=null;}
  save();
}
function returnBase(){
  if(!data.shift){alert("勤務中ではありません");return;}
  if(data.active && !confirm("乗務が進行中です。勤務終了しますか？"))return;
  if(data.active){alert("進行中の乗務を先に降車またはキャンセルで終了してください");return;}
  data.shift.end=now();event("帰庫・勤務終了");data.shift=null;data.rest=null;stopGPS();save();
}
function pasteBooking(){
  const text=$("bookingPaste").value.trim();if(!text)return alert("予約内容を貼り付けてください");
  data.bookings.push({id:crypto.randomUUID(),time:$("bookingTime").value||"",place:text,note:"貼り付け内容",createdAt:now(),done:false});
  $("bookingPaste").value="";save();
}
$("bookingForm").addEventListener("submit",e=>{
  e.preventDefault();
  data.bookings.push({id:crypto.randomUUID(),time:$("bookingTime").value,place:$("bookingPlace").value,note:$("bookingNote").value,createdAt:now(),done:false});
  e.target.reset();save();
});
function removeBooking(id){data.bookings=data.bookings.filter(b=>b.id!==id);save();}
function editFare(id){
  const j=data.rides.find(x=>x.id===id);if(!j)return;
  const v=prompt("修正後の運賃（円）",j.fare==null?"":String(j.fare));if(v===null)return;
  const n=Number(v);if(!Number.isFinite(n)||n<0)return alert("金額が正しくありません");
  event("運賃修正",{rideId:id,oldFare:j.fare,newFare:n});j.fare=n;j.fareEditedAt=now();save();
}
function render(){
  const complete=data.rides.filter(j=>j.stage==="完了"&&j.dropTime&&new Date(j.dropTime).toLocaleDateString("sv-SE")===today());
  $("sales").textContent=yen(complete.reduce((s,j)=>s+Number(j.fare||0),0));
  $("rides").textContent=complete.length;
  $("shiftStatus").textContent=data.shift?"勤務中："+new Date(data.shift.start).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"}):"勤務外";
  $("shiftBtn").textContent=data.shift?"勤務中":"勤務開始";
  if(data.shift){
    const mins=Math.floor((Date.now()-new Date(data.shift.start).getTime())/60000);
    $("hours").textContent=mins>=60?Math.floor(mins/60)+"時間"+mins%60+"分":mins+"分";
  }else $("hours").textContent="0分";
  $("restBtn").textContent=data.rest?"休憩終了":"休憩開始";
  $("restStatus").textContent=data.rest?"休憩開始："+new Date(data.rest.start).toLocaleTimeString("ja-JP"):"休憩中ではありません";
  $("otherSource").value=data.settings.other||"DiDi";$("otherDispatch").textContent=getOtherSource();
  renderActive();renderBookings();renderHistory();drawRoute();
}
function renderActive(){
  const j=data.active,box=$("activeJob"),actions=$("jobActions");actions.innerHTML="";
  if(!j){box.textContent="進行中の乗務はありません。";return;}
  box.innerHTML=`<b>${escapeHtml(j.source)}</b> / ${escapeHtml(j.stage)}<br>
  配車時刻：${new Date(j.dispatchTime).toLocaleTimeString("ja-JP")}<br>
  運賃：${j.fare==null?"未入力":yen(j.fare)}
  ${j.arrivalTime?`<br>現着：${new Date(j.arrivalTime).toLocaleTimeString("ja-JP")}`:""}`;
  const add=(text,fn,cls="")=>{const b=document.createElement("button");b.textContent=text;b.onclick=fn;if(cls)b.className=cls;actions.appendChild(b);};
  if(j.source!=="流し"&&j.stage==="迎車中")add("現着",arrival,"success");
  if(j.stage==="現着"){
    add("出発",boarding,"primary");
    const elapsed=Date.now()-new Date(j.arrivalTime).getTime();
    add(elapsed>=300000?"乗務員キャンセル":"乗務員キャンセル（5分待ち）",()=>cancelRide("乗務員"),"danger");
  }
  if(j.stage==="乗車中"){
    add("金額入力",fare,"primary");add("降車",dropoff,"success");
  }
  if(j.source!=="流し"&&j.stage==="迎車中")add("客キャンセル",()=>cancelRide("客"),"danger");
  if(j.stage==="現着")add("客キャンセル",()=>cancelRide("客"),"danger");
  if(j.stage==="乗車中"&&j.source!=="流し")add("客キャンセル",()=>cancelRide("客"),"danger");
  add("追加",addJob);
}
function renderBookings(){
  const box=$("bookingList");
  const list=[...data.bookings].sort((a,b)=>(a.time||"").localeCompare(b.time||""));
  box.innerHTML=list.length?"":"<p class='muted'>予約はありません。</p>";
  list.forEach(b=>{
    const d=document.createElement("div");d.className="item";
    d.innerHTML=`<b>${escapeHtml(b.time||"時刻未設定")}</b><br>${escapeHtml(b.place||"場所未設定")}<br><small>${escapeHtml(b.note||"")}</small>`;
    const btn=document.createElement("button");btn.textContent="削除";btn.onclick=()=>removeBooking(b.id);d.appendChild(btn);box.appendChild(d);
  });
}
function renderHistory(){
  const box=$("history");if(!box)return;
  const list=[...data.rides].reverse();
  box.innerHTML=list.length?"":"<p class='muted'>乗車履歴はありません。</p>";
  list.forEach(j=>{
    const d=document.createElement("div");d.className="item";
    d.innerHTML=`<b>${escapeHtml(j.source)}</b>　${escapeHtml(j.stage)}<br>
    配車：${new Date(j.dispatchTime).toLocaleString("ja-JP")}<br>
    運賃：${j.fare==null?"未入力":yen(j.fare)} ${j.cancelType?"／"+escapeHtml(j.cancelType)+"キャンセル":""}`;
    if(j.fare!=null){const b=document.createElement("button");b.textContent="運賃を修正";b.onclick=()=>editFare(j.id);d.appendChild(b);}
    box.appendChild(d);
  });
}
function exportData(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="taxi-notebook-"+today()+".json";a.click();URL.revokeObjectURL(a.href);
}
function importData(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.rides)||!Array.isArray(d.events))throw Error("形式が違います");
      if(!confirm("現在のデータをバックアップ内容で置き換えますか？"))return;
      data=d;save();alert("復元しました");
    }catch(err){alert("復元できません："+err.message);}
  };r.readAsText(file);e.target.value="";
}
function escapeHtml(s){
  return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function drawRoute(){
  if(!map)return;
  if(routeLine){map.removeLayer(routeLine);routeLine=null;}
  markers.forEach(m=>map.removeLayer(m));markers=[];
  const j=data.active;if(!j||!j.route||!j.route.length)return;
  const pts=j.route.filter(p=>p.lat!=null&&p.lon!=null).map(p=>[p.lat,p.lon]);
  if(pts.length){
    routeLine=L.polyline(pts,{color:j.source==="流し"?"#16845b":j.source==="Uber"?"#111827":j.source==="GO"?"#1769d2":"#8b5cf6",weight:5}).addTo(map);
  }
}
function initMap(){
  map=L.map("map").setView([35.1815,136.9066],12);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
}
initMap();render();
if(data.shift)startGPS();
setInterval(()=>{if(data.shift)render();},15000);
</script>
</body>
</html>
