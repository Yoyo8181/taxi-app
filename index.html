
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タクシー売上管理</title>
  <link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f7fa;
    }
    h1 { font-size: 24px; }
    button {
      padding: 14px 18px;
      margin: 5px 3px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    .start { background: #1769aa; color: white; }
    .end { background: #24864b; color: white; }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      font-size: 16px;
    }
    .record {
      background: white;
      padding: 14px;
      margin: 12px 0;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }
    #message {
      margin: 15px 0;
      padding: 12px;
      background: white;
      border-radius: 8px;
    }
    .small { font-size: 13px; color: #555; }
  </style>
</head>
<body>
  <h1>🚕 タクシー売上管理</h1>
  <p>よよのアプリ開発、ステップアップ！</p>

  <button class="start" onclick="recordRide()">乗車</button>
  <button class="end" onclick="recordDrop()">降車</button>

  <div>
    <label for="fare">運賃（円）</label>
    <input
      type="number"
      id="fare"
      min="0"
      step="10"
      placeholder="例：1800"
    >
  </div>

  <div id="message">乗車ボタンから記録を始めよう。</div>

  <h2>今日の売上</h2>
  <div id="todaySales">0円</div>

  <h2>今日の営業回数</h2>
  <div id="todayCount">0回</div>

  <h2>今日の平均単価</h2>
  <div id="todayAverage">0円</div>

  <h2>累計売上</h2>
  <div id="totalSales">0円</div>

  <h2>日別売上</h2>
  <div id="dailySales"></div>

  <h2>乗降地点マップ</h2>
  <div id="map" style="height: 350px; border-radius: 8px;"></div>
  
  <h2>乗車履歴</h2>
  <div id="history"></div>

  <script>
    let currentRide = null;
    let rides = JSON.parse(localStorage.getItem("taxiRides") || "[]");

    function saveCurrentRide() {
      localStorage.setItem(
        "taxiCurrentRide",
        JSON.stringify(currentRide)
      );
    }

    function saveRides() {
      localStorage.setItem("taxiRides", JSON.stringify(rides));
    }

    function loadCurrentRide() {
      const saved = localStorage.getItem("taxiCurrentRide");

      if (saved) {
        try {
          currentRide = JSON.parse(saved);
        } catch (error) {
          currentRide = null;
        }
      }
    }

    function getLocation(callback) {
      const message = document.getElementById("message");

      if (!navigator.geolocation) {
        message.textContent = "このブラウザはGPSに対応していません。";
        return;
      }

      message.textContent = "現在地を取得しています...";

      navigator.geolocation.getCurrentPosition(
        function(position) {
          callback({
            time: new Date().toISOString(),
            lat: position.coords.latitude,
            lon: position.coords.longitude
          });
        },
        function() {
          message.textContent =
            "位置情報を取得できませんでした。位置情報の許可や通信を確認してください。";
        },
        { enableHighAccuracy: true, timeout: 15000 }
      );
    }

    function formatTime(time) {
      return new Date(time).toLocaleString("ja-JP");
    }

    function formatDate(time) {
      return new Date(time).toLocaleDateString("ja-JP");
    }

    function formatYen(amount) {
      return (Number(amount) || 0).toLocaleString("ja-JP") + "円";
    }

    function recordRide() {
      if (currentRide) {
        document.getElementById("message").textContent =
          "まだ降車が記録されていないよ。先に降車ボタンを押してね。";
        return;
      }

      getLocation(function(location) {
        currentRide = {
          pickup: location,
          dropoff: null
        };

        saveCurrentRide();

        document.getElementById("message").textContent =
          "乗車を記録したよ！ 降車したら運賃を入力してね。";

        renderHistory();
      });
    }

    function recordDrop() {
      if (!currentRide) {
        document.getElementById("message").textContent =
          "先に乗車ボタンを押してね。";
        return;
      }

      const fareInput = document.getElementById("fare");
      const fareText = fareInput.value.trim();
      const fare = Number(fareText);

      if (fareText === "" || !Number.isFinite(fare) || fare < 0) {
        document.getElementById("message").textContent =
          "降車前に正しい運賃を入力してね。";
        return;
      }

      getLocation(function(location) {
        currentRide.dropoff = location;
        currentRide.fare = fare;

        rides.unshift(currentRide);
        currentRide = null;

        saveCurrentRide();
        saveRides();

        fareInput.value = "";

        document.getElementById("message").textContent =
          "降車を記録したよ！ 履歴に保存したよ。";

        renderHistory();
      });
    }


let map;
let mapMarkers = [];

function initializeMap() {
  map = L.map("map").setView([35.1709, 136.8815], 11);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);
}

function renderMapMarkers() {
  if (!map) return;

  mapMarkers.forEach(function(marker) {
    map.removeLayer(marker);
  });
  mapMarkers = [];

  const points = [];

  rides.forEach(function(ride) {
    if (ride.pickup) {
      points.push({
        location: ride.pickup,
        label: "乗車地点",
        color: "blue"
      });
    }

    if (ride.dropoff) {
      points.push({
        location: ride.dropoff,
        label: "降車地点",
        color: "red"
      });
    }
  });

  if (currentRide && currentRide.pickup) {
    points.push({
      location: currentRide.pickup,
      label: "乗車中の乗車地点",
      color: "blue"
    });
  }

  points.forEach(function(point) {
    const location = point.location;

    if (
      typeof location.lat !== "number" ||
      typeof location.lon !== "number"
    ) {
      return;
    }

    const marker = L.marker([location.lat, location.lon])
      .addTo(map)
      .bindPopup(
        point.label + "<br>" + formatTime(location.time)
      );

    mapMarkers.push(marker);
  });

  if (points.length > 0) {
    const validPoints = points
      .filter(function(point) {
        return typeof point.location.lat === "number" &&
               typeof point.location.lon === "number";
      })
      .map(function(point) {
        return [point.location.lat, point.location.lon];
      });

    if (validPoints.length > 0) {
      map.fitBounds(validPoints, { padding: [25, 25], maxZoom: 15 });
    }
  }
}

    function renderHistory() {
      const dailyTotals = {};

      rides.forEach(function(ride) {
        if (!ride.dropoff || !ride.dropoff.time) return;

        const date = formatDate(ride.dropoff.time);
        dailyTotals[date] =
          (dailyTotals[date] || 0) + (Number(ride.fare) || 0);
      });

      const dailySales = document.getElementById("dailySales");
      dailySales.innerHTML = "";

      Object.keys(dailyTotals).forEach(function(date) {
        const item = document.createElement("div");
        item.className = "record";
        item.textContent = date + "：" + formatYen(dailyTotals[date]);
        dailySales.appendChild(item);
      });

      if (Object.keys(dailyTotals).length === 0) {
        dailySales.textContent = "まだ売上記録はありません。";
      }

      const today = formatDate(new Date());

      const todayTotal = rides.reduce(function(total, ride) {
        if (!ride.dropoff || !ride.dropoff.time) return total;

        if (formatDate(ride.dropoff.time) === today) {
          return total + (Number(ride.fare) || 0);
        }
        return total;
      }, 0);

      const totalSales = rides.reduce(function(total, ride) {
        return total + (Number(ride.fare) || 0);
      }, 0);

      document.getElementById("todaySales").textContent =
        formatYen(todayTotal);

           // 今日の営業回数を数える
      const todayCount = rides.filter(function(ride) {
        if (!ride.dropoff || !ride.dropoff.time) return false;
        return formatDate(ride.dropoff.time) === today;
      }).length;

      // 今日の平均単価を計算する
      const todayAverage = todayCount > 0
        ? todayTotal / todayCount
        : 0;

      // 画面に表示する
      document.getElementById("todayCount").textContent =
        todayCount + "回";

      document.getElementById("todayAverage").textContent =
        formatYen(Math.round(todayAverage));

      document.getElementById("totalSales").textContent =
        formatYen(totalSales);

      const history = document.getElementById("history");
      history.innerHTML = "";

      if (currentRide) {
        const current = document.createElement("div");
        current.className = "record";

        current.innerHTML =
          "<strong>乗車中（記録待ち）</strong><br>" +
          "乗車時刻：" + formatTime(currentRide.pickup.time) +
          "<p class='small'>乗車地点：" +
          currentRide.pickup.lat + ", " + currentRide.pickup.lon +
          "</p>";

        history.appendChild(current);
      }

      if (rides.length === 0 && !currentRide) {
        history.textContent = "まだ履歴はありません。";
        return;
      }

      rides.forEach(function(ride, index) {
        if (!ride.pickup || !ride.dropoff) return;

        const item = document.createElement("div");
        item.className = "record";

        const pickup = ride.pickup;
        const dropoff = ride.dropoff;

        item.innerHTML =
          "<strong>記録 " + (rides.length - index) + "</strong><br>" +
          "乗車時刻：" + formatTime(pickup.time) + "<br>" +
          "降車時刻：" + formatTime(dropoff.time) + "<br>" +
          "運賃：" + formatYen(ride.fare) +
          "<p class='small'>乗車地点：" +
          pickup.lat + ", " + pickup.lon + "</p>" +
          "<p class='small'>降車地点：" +
          dropoff.lat + ", " + dropoff.lon + "</p>";

        history.appendChild(item);
      });
    }

    loadCurrentRide();
    initializeMap();
    renderHistory();
    renderMapMarkers();
  </script>
</body>
</html>
