
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101e2d">
<title>タクシー営業ノート</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root {
  --bg:#101e2d; --panel:#1b2b3d; --line:#34475a;
  --text:#f3f7fb; --muted:#a8bacb; --green:#24c68a;
  --blue:#438cff; --orange:#ffad45; --red:#ff6874;
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}
button,input,select { font:inherit; }
button { cursor:pointer; color:white; border:0; }
.app {
  height:100vh;
  height:100dvh;
  overflow:hidden;
  display:grid;
 grid-template-rows:auto auto auto minmax(0,1fr) auto auto;
  gap:7px;
  padding:8px;
  padding-top:max(8px,env(safe-area-inset-top));
  padding-bottom:max(6px,env(safe-area-inset-bottom));
}
header { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.brand { font-size:16px; font-weight:800; }
.status { color:var(--green); font-size:11px; }
.metrics { display:grid; grid-template-columns:1.25fr 1fr 1fr; gap:7px; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:9px; min-width:0; }
.caption { color:var(--muted); font-size:11px; }
.value { font-size:clamp(16px,4.8vw,23px); font-weight:800; margin-top:4px; white-space:nowrap; }
.sub { color:var(--muted); font-size:10px; margin-top:3px; }
.progress { height:4px; background:#35465a; border-radius:8px; margin-top:7px; overflow:hidden; }
#progressBar { height:100%; width:0; background:var(--green); }
.mapbox {
  height:100%;
  min-height:0;
  position:relative;
  overflow:hidden;
  border-radius:12px;
  border:1px solid var(--line);
}
#map { height:100%; width:100%; background:#26394a; }
.map-tools { position:absolute; z-index:500; right:7px; top:7px; display:grid; gap:6px; }
.map-tools button { background:#132337eF; border:1px solid #506277; border-radius:8px; padding:9px; font-size:12px; }
.map-label { position:absolute; z-index:500; bottom:7px; left:7px; background:#132337eF; padding:6px 8px; border-radius:7px; font-size:10px; pointer-events:none; }
.dispatch { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; }
.dispatch button { min-height:48px; border-radius:10px; font-size:12px; font-weight:800; }
.uber { background:#303b49; } .go { background:#e0b82c; color:#19202b; }
.street { background:#258c69; } .other { background:#6654bc; }
.actions {
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:5px;
}
.action {
  min-width:0;
  min-height:43px;
  padding:6px 1px;
  border-radius:10px;
  font-weight:800;
  font-size:clamp(10px,2.8vw,13px);
  white-space:nowrap;
}
.primary { background:var(--green); color:#09271e; }
.secondary { background:#30465b; }
nav { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; }
nav button { background:transparent; color:var(--muted); padding:7px 2px; border-radius:8px; font-size:11px; }
nav button.active { color:var(--green); background:#203b43; }
.page {
  display:none;
  height:100%;
  min-height:0;
  overflow:auto;
}

.page.active {
  display:block;
}

#homePage {
  overflow:hidden;
}

#homePage .mapbox {
  height:100%;
}
.page h2 { font-size:18px; margin:5px 0 12px; }
.row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
.field { margin:10px 0; }
.field label { display:block; font-size:12px; color:var(--muted); margin-bottom:5px; }
.field input,.field select { width:100%; padding:11px; border-radius:8px; border:1px solid var(--line); background:#102033; color:white; }
.full { width:100%; padding:12px; border-radius:9px; margin-top:7px; font-weight:700; }
.listitem { padding:10px 0; border-bottom:1px solid var(--line); font-size:13px; }
.note { color:var(--muted); font-size:11px; line-height:1.6; }
@media(max-height:690px) {
  .app { gap:5px; padding:5px; padding-top:max(5px,env(safe-area-inset-top)); padding-bottom:max(4px,env(safe-area-inset-bottom)); }
  .panel { padding:6px; }
  .value { font-size:16px; }
  .dispatch button { min-height:41px; font-size:11px; }
  .action { min-height:37px; }
  nav button { padding:5px 2px; }
}


.reservation-preview {
  display: grid;
  grid-template-columns: 1fr;
  gap: 4px;
  min-width: 0;
  padding: 5px 8px;
  border: 1px solid #263b50;
  border-radius: 9px;
  background: #101d2c;
}

.reservation-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  min-height: 25px;
  font-size: 12px;
  color: #dce7f2;
}

.reservation-row strong {
  flex: 0 0 42px;
  color: #70d6a1;
}

.reservation-row span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}


.reservation-row button {
  background: #263b50;
  color: #ffffff;
  border: 1px solid #70d6a1;
  border-radius: 6px;
  padding: 5px 8px;
  font-size: 12px;
  font-weight: bold;
  white-space: nowrap;
}

  
/* 下部メニューを5つ横一列にする */
nav {
  display: flex;
  flex-wrap: nowrap;
  gap: 2px;
}

nav button {
  flex: 1;
  min-width: 0;
  padding: 10px 1px;
  font-size: 11px;
  white-space: nowrap;
}

/* 予約一覧の編集・削除ボタンを見やすくする */
#reservationList .listitem button {
  background: #263b50;
  color: #ffffff;
  border: 1px solid #70d6a1;
  border-radius: 6px;
  padding: 7px 12px;
  font-size: 13px;
  font-weight: bold;
}
 
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="brand">🚕 営業ノート</div>
      <div class="status" id="shiftStatus">● 営業前</div>
    </div>
    <button class="secondary" style="padding:9px;border-radius:8px" onclick="toggleShift()" id="shiftButton">営業開始</button>
  </header>

  <section class="metrics">
    <div class="panel">
      <div class="caption">本日の売上</div>
      <div class="value" id="sales">¥0</div>
      <div class="progress"><div id="progressBar"></div></div>
      <div class="sub" id="goalText">目標 ¥50,000</div>
    </div>
    <div class="panel">
      <div class="caption">乗車回数</div>
      <div class="value" id="rideCount">0回</div>
      <div class="sub">本日</div>
    </div>
    <div class="panel">
      <div class="caption">目標まで</div>
      <div class="value" id="remaining">¥50,000</div>
      <div class="sub">残り売上</div>
    </div>
  </section>

 <section id="dispatchButtons" class="dispatch">
    <button class="street" onclick="recordDispatch('流し')">流し</button>
    <button class="uber" onclick="recordDispatch('Uber')">Uber</button>
    <button class="go" onclick="recordDispatch('GO')">GO</button>
    <button class="other" onclick="recordDispatch('その他')">その他</button>
  </section>

  <main class="page active" id="homePage">
    <div class="mapbox">
      <div id="map"></div>
      <div class="map-tools">
        <button onclick="locateMe()">◎ 現在地</button>
        <button onclick="showAllPoints()">乗降地点</button>
      </div>
      <div class="map-label" id="mapStatus">地図を読み込み中…</div>
    </div>
  </main>
  
    <section id="reservationPreview" class="reservation-preview">
    <div class="reservation-row" id="reservationRow1">
      <strong>予約1</strong>
      <span>予約はありません</span>
    </div>
    <div class="reservation-row" id="reservationRow2">
      <strong>予約2</strong>
      <span>予約はありません</span>
    </div>
  </section>
  
  <main class="page" id="recordPage">
    <h2>🚘 乗車・降車記録</h2>
    <div class="panel">
      <div class="field">
        <label>乗車場所</label>
        <input id="pickup" placeholder="乗車場所">
      </div>
      <div class="field">
        <label>降車場所</label>
        <input id="dropoff" placeholder="降車場所">
      </div>
      <div class="field">
        <label>運賃（円）</label>
        <input id="fare" type="number" min="0" step="10" placeholder="例：2500">
      </div>
      <div class="field">
        <label>乗車方法</label>
        <select id="rideSource">
          <option>Uber</option><option>GO</option><option>流し</option>
          <option>無線・その他</option><option>予約</option>
        </select>
      </div>
      <button class="full primary" onclick="saveRide()">乗車記録を保存</button>
      <button class="full secondary" onclick="stampPickup()">現在時刻を乗車時刻に記録</button>
      <div class="note" id="rideTime">乗車時刻：未記録</div>
    </div>
  </main>

  <main class="page" id="reservationPage">
    <h2>📅 予約登録</h2>
    <div class="panel">
      <div class="field">
        <label>予約日</label>
        <input id="reservationDate" type="date" value="">
      </div>
      <div class="field">
        <label>予約時刻</label>
        <input id="reservationClock" type="time">
      </div>
      <div class="field">
        <label>お客様名（任意）</label>
        <input id="reservationCustomer" placeholder="お客様名">
      </div>
      <div class="field">
        <label>電話番号</label>
        <input
          id="reservationPhone"
          type="tel"
          placeholder="09012345678"
          inputmode="tel"
          autocomplete="tel"
        >
      </div>
      <div class="field">
        <label>乗車場所</label>
        <input id="reservationPickup" placeholder="乗車場所">
      </div>
      <div class="field">
        <label>降車場所</label>
        <input id="reservationDropoff" placeholder="降車場所">
      </div>
      <button class="full primary" onclick="saveReservation()">予約を保存</button>
      <button class="full secondary" onclick="openPage('homePage')">キャンセルして戻る</button>
    </div>
  </main>
  
  <main class="page" id="reservationListPage">
    <h2>📅 予約一覧</h2>
    <div class="panel">
      <div class="row">
        <strong>登録済みの予約</strong>
        <button class="secondary" style="padding:7px;border-radius:7px" onclick="addReservation()">＋ 予約追加</button>
      </div>
      <div id="reservationList"></div>
      <button class="full secondary" onclick="openPage('homePage')">トップに戻る</button>
    </div>
  </main>
  
  <main class="page" id="historyPage">
    <h2>📋 営業履歴</h2>
    <div class="panel">
      <div class="row">
        <strong>記録一覧</strong>
        <button class="secondary" style="padding:7px;border-radius:7px" onclick="exportData()">データ出力</button>
      </div>
      <div id="historyList"></div>
    </div>
  </main>

  <main class="page" id="settingsPage">
    <h2>⚙️ 設定・集計</h2>
    <div class="panel">
      <div class="field">
        <label>1日の売上目標（円）</label>
        <input id="goalInput" type="number" min="0" step="1000" value="50000">
      </div>
      <button class="full primary" onclick="saveGoal()">目標を保存</button>
      <div class="field">
        <label>バックアップデータの読み込み</label>
        <input type="file" id="importFile" accept=".json,application/json">
      </div>
      <button class="full secondary" onclick="importData()">バックアップを読み込む</button>
      <p class="note">記録はこのブラウザ内に保存されます。ブラウザのデータ削除や別端末では記録が消えたり共有されなかったりするため、定期的にデータを出力してください。</p>
    </div>
  </main>

  <section id="homeActions" class="actions">
    <button class="action primary" onclick="toggleRest()">休憩</button>
    <button class="action secondary" onclick="openPage('historyPage')">データ</button>
    <button class="action secondary" onclick="openPage('reservationPage')">予約</button>
    <button class="action secondary" onclick="openPage('settingsPage')">その他</button>
    <button class="action secondary" onclick="toggleShift()">帰庫</button>
  </section>

 
<nav>
    <button class="active" onclick="openPage('homePage',this)">⌂ ホーム</button>
    <button onclick="openPage('recordPage',this)">＋ 記録</button>
    <button onclick="openPage('reservationListPage',this)">📅 予約一覧</button>
    <button onclick="openPage('historyPage',this)">☷ 履歴</button>
    <button onclick="openPage('settingsPage',this)">⚙ 設定</button>
</nav>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const KEY = 'yoyoTaxiV1';
let state = JSON.parse(localStorage.getItem(KEY) || 'null') || {
  rides: [], dispatches: [], goal: 50000, active: false
};
let map, userMarker, rideStartTime = '';
let pickupPoint = null, dropoffPoint = null;

function persist() {
  localStorage.setItem(KEY, JSON.stringify(state));
  render();
}
function today() {
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function yen(n) { return '¥'+Number(n||0).toLocaleString('ja-JP'); }
function todaysRides() { return state.rides.filter(r=>r.date===today()); }

function render() {
  const rides = todaysRides();
  const total = rides.reduce((s,r)=>s+Number(r.fare||0),0);

  document.getElementById('sales').textContent=yen(total);
  document.getElementById('rideCount').textContent=rides.length+'回';
  document.getElementById('remaining').textContent=yen(Math.max(0,state.goal-total));
  document.getElementById('goalText').textContent='目標 '+yen(state.goal);
  document.getElementById('progressBar').style.width=Math.min(100,state.goal?total/state.goal*100:0)+'%';
  document.getElementById('shiftStatus').textContent=state.active?'● 営業中':'● 営業前';
  document.getElementById('shiftButton').textContent=state.active?'営業終了':'営業開始';
  document.getElementById('goalInput').value=state.goal;

  document.getElementById('historyList').innerHTML = state.rides.slice().reverse().map(r=>
    `<div class="listitem"><div class="row"><strong>${yen(r.fare)}</strong><span>${escapeHtml(r.source)}</span></div><div>${escapeHtml(r.pickup||'乗車場所未入力')} → ${escapeHtml(r.dropoff||'降車場所未入力')}</div><div class="note">${escapeHtml(r.date||'')} ${escapeHtml(r.time||'')}</div></div>`
  ).join('') || '<p class="note">まだ記録がありません。</p>';

  // 予約を日時順に並べる
  const reservations = (state.dispatches || [])
    .filter(d => d.source === '予約')
    .map(d => ({
      ...d,
      date: d.date || today(),
      reservationTime: d.reservationTime || '',
      pickup: d.pickup || d.place || '',
      dropoff: d.dropoff || '',
      customer: d.customer || ''
    }))
    .filter(d => {
      const dt = new Date(d.date + 'T' + (d.reservationTime || '00:00'));
      return !isNaN(dt.getTime()) && dt >= new Date();
    })
    .sort((a,b) =>
      (a.date + ' ' + a.reservationTime)
        .localeCompare(b.date + ' ' + b.reservationTime)
    )
    .slice(0,2);

  [1,2].forEach((n,i) => {
    const row = document.getElementById('reservationRow' + n);
    if (!row) return;

    const r = reservations[i];
       row.innerHTML = r
      ? `<strong>予約${n}</strong>
         <span>${escapeHtml(r.date)} ${escapeHtml(r.reservationTime)}　${escapeHtml(r.customer || '名前未登録')}　${escapeHtml(r.pickup || '乗車地未登録')} → ${escapeHtml(r.dropoff || '降車地未登録')}</span>
         <button type="button" onclick="editReservation('${r.id || ''}')">編集</button>
         <button type="button" onclick="deleteReservation('${r.id || ''}')">削除</button>`
      : `<strong>予約${n}</strong><span>予約はありません</span>`;
  });

  const reservationList = document.getElementById('reservationList');

  if (reservationList) {
    const allReservations = (state.dispatches || [])
      .filter(d => d.source === '予約')
      .map(d => ({
        ...d,
        date: d.date || today(),
        reservationTime: d.reservationTime || '',
        pickup: d.pickup || d.place || '',
        dropoff: d.dropoff || '',
        customer: d.customer || ''
      }))
      .sort((a, b) =>
        (a.date + ' ' + a.reservationTime)
          .localeCompare(b.date + ' ' + b.reservationTime)
      );

    reservationList.innerHTML = allReservations.length
      ? allReservations.map(r => `
          <div class="listitem">
            <div><strong>${escapeHtml(r.date)} ${escapeHtml(r.reservationTime)}</strong></div>
            <div>${escapeHtml(r.customer || '名前未登録')}</div>
            <div>${escapeHtml(r.pickup || '乗車地未登録')} → ${escapeHtml(r.dropoff || '降車地未登録')}</div>
            <div class="row">
              <button type="button" onclick="editReservation('${r.id || ''}')">編集</button>
              <button type="button" onclick="deleteReservation('${r.id || ''}')">削除</button>
            </div>
          </div>
        `).join('')
      : '<p class="note">予約はありません。</p>';
  }

}
let resting = false;

function toggleRest() {
  resting = !resting;
  document.getElementById('mapStatus').textContent =
    resting ? '休憩中' : '営業を再開しました';
  alert(resting ? '休憩を開始しました' : '休憩を終了しました');
}

let editingReservationId = null;

function addReservation() {
  const dateInput = document.getElementById('reservationDate');
  if (dateInput && !dateInput.value) {
    dateInput.value = today();
  }

  openPage('reservationPage');
}


function editReservation(id) {
  if (!id) {
    alert('この予約は古いデータのため、編集できません。');
    return;
  }

  const reservation = state.dispatches.find(
  d => d.source === '予約' && String(d.id) === String(id)
);
  if (!reservation) {
    alert('予約が見つかりません。');
    return;
  }

  editingReservationId = id;

  document.getElementById('reservationDate').value = reservation.date || '';
  document.getElementById('reservationClock').value = reservation.reservationTime || '';
  document.getElementById('reservationCustomer').value = reservation.customer || '';
  document.getElementById('reservationPickup').value = reservation.pickup || reservation.place || '';
  document.getElementById('reservationDropoff').value = reservation.dropoff || '';

  openPage('reservationPage');
}

function deleteReservation(id) {
  if (!id) {
    alert('この予約は古いデータのため、削除できません。');
    return;
  }

  if (!confirm('この予約を削除しますか？')) {
    return;
  }

  state.dispatches = state.dispatches.filter(d => d.id !== id);
  persist();
  alert('予約を削除しました');
}


function saveReservation() {
  const date = document.getElementById('reservationDate').value;
  const time = document.getElementById('reservationClock').value;
  const customer = document.getElementById('reservationCustomer').value.trim();
  const pickup = document.getElementById('reservationPickup').value.trim();
  const dropoff = document.getElementById('reservationDropoff').value.trim();

  if (!date || !time) {
    alert('予約日と予約時刻を入力してください');
    return;
  }

  if (editingReservationId !== null) {
    const index = state.dispatches.findIndex(
      d => d.id === editingReservationId
    );

    if (index === -1) {
      alert('編集する予約が見つかりません。');
      return;
    }

    state.dispatches[index] = {
      ...state.dispatches[index],
      customer,
      pickup,
      dropoff,
      place: pickup,
      reservationTime: time,
      date
    };
  } else {
    state.dispatches.push({
      id: Date.now().toString() + Math.random().toString(36).slice(2),
      source: '予約',
      customer,
      pickup,
      dropoff,
      place: pickup,
      reservationTime: time,
      date,
      time: new Date().toISOString()
    });
  }

  editingReservationId = null;
  persist();

  document.getElementById('reservationDate').value = '';
  document.getElementById('reservationClock').value = '';
  document.getElementById('reservationCustomer').value = '';
  document.getElementById('reservationPickup').value = '';
  document.getElementById('reservationDropoff').value = '';

  openPage('homePage');
  alert('予約を保存しました');
}


function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toggleShift() {
  state.active=!state.active;
  persist();
}
function recordDispatch(source) {
  state.dispatches.push({source,time:new Date().toISOString(),date:today()});
  persist();
  document.getElementById('mapStatus').textContent=source+' を記録しました';
}
function openPage(id, button) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('dispatchButtons').style.display=id==='homePage'?'grid':'none';
  document.getElementById('homeActions').style.display=id==='homePage'?'grid':'none';
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  if(button) button.classList.add('active');
  else {
    const index={homePage:0,recordPage:1,historyPage:2,settingsPage:3}[id];
    document.querySelectorAll('nav button')[index].classList.add('active');
  }
  if(id==='homePage' && map) setTimeout(()=>map.invalidateSize(),100);
}
function saveGoal() {
  state.goal=Math.max(0,Number(document.getElementById('goalInput').value)||0);
  persist();
  alert('目標を保存しました');
}
function stampPickup() {
  rideStartTime=new Date().toISOString();
  document.getElementById('rideTime').textContent='乗車時刻：'+new Date(rideStartTime).toLocaleString('ja-JP');
}
function saveRide() {
  const fare=Number(document.getElementById('fare').value);
  if(!document.getElementById('fare').value || fare<0) {
    alert('運賃を入力してください'); return;
  }
  const r={
    date:today(), time:new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}),
    pickup:document.getElementById('pickup').value.trim(),
    dropoff:document.getElementById('dropoff').value.trim(),
    fare, source:document.getElementById('rideSource').value,
    pickupTime:rideStartTime||'', pickupCoords:pickupPoint, dropoffCoords:dropoffPoint
  };
  state.rides.push(r); persist();
  document.getElementById('pickup').value='';
  document.getElementById('dropoff').value='';
  document.getElementById('fare').value='';
  rideStartTime='';
  document.getElementById('rideTime').textContent='乗車時刻：未記録';
  alert('乗車記録を保存しました');
  openPage('homePage');
}
function locateMe() {
  if(!navigator.geolocation) { alert('この端末では位置情報を利用できません'); return; }
  document.getElementById('mapStatus').textContent='現在地を確認中…';
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude, lon=pos.coords.longitude;
    if(map) {
      map.setView([lat,lon],16);
      if(userMarker) userMarker.setLatLng([lat,lon]);
      else userMarker=L.marker([lat,lon]).addTo(map).bindPopup('現在地');
    }
    document.getElementById('mapStatus').textContent='現在地を表示中';
  },err=>{
    document.getElementById('mapStatus').textContent='位置情報を取得できません';
    alert('位置情報が取得できません。ブラウザの位置情報許可を確認してください。');
  },{enableHighAccuracy:true,timeout:15000,maximumAge:10000});
}
function showAllPoints() {
  if(!map) return;
  const pts=[];
  state.rides.forEach(r=>{
    if(r.pickupCoords) pts.push(r.pickupCoords);
    if(r.dropoffCoords) pts.push(r.dropoffCoords);
  });
  if(pts.length) map.fitBounds(pts,{padding:[20,20]});
  else document.getElementById('mapStatus').textContent='記録された位置情報はまだありません';
}
function exportData() {
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download='taxi-backup-'+today()+'.json'; a.click();
  URL.revokeObjectURL(url);
}
function importData() {
  const file=document.getElementById('importFile').files[0];
  if(!file) { alert('先にバックアップファイルを選んでください'); return; }
  const reader=new FileReader();
  reader.onload=()=>{
    try {
      const data=JSON.parse(reader.result);
      if(!Array.isArray(data.rides)) throw new Error();
      if(confirm('現在の記録を読み込んだデータで置き換えますか？')) {
        state=data; persist(); alert('読み込みました');
      }
    } catch(e) { alert('このファイルは読み込めませんでした'); }
  };
  reader.readAsText(file);
}
function initMap() {
  const el=document.getElementById('map');
  if(!window.L) {
    document.getElementById('mapStatus').textContent='地図を読み込めません。通信を確認してください';
    return;
  }
  map=L.map(el,{zoomControl:false}).setView([35.1815,136.9066],12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19, attribution:'© OpenStreetMap'
  }).addTo(map);
  L.control.zoom({position:'bottomright'}).addTo(map);
  document.getElementById('mapStatus').textContent='名古屋周辺｜現在地ボタンで移動';
}
render();
initMap();
window.addEventListener('resize',()=>{if(map)map.invalidateSize();});
</script>
</body>
</html>
